<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Check odd or even</title>
</head>
<body>
   <script>

    //1
    function checkOdd(num){
       let rem = num % 2;
       let checkOdd = rem === 1;
       return checkOdd;
    }

    console.log(checkOdd(5));
    console.log(checkOdd(6));

    //2
    function larger(num1, num2){
        if (num1 > num2){
            return num1;
        }else{
            return num2;
        }
       // return num1 > num2 ? num1 : num2;
    }
    console.log(larger(10, 20));
    console.log(larger(30, 20));

    //3
    function toFahrenheit(celsiusValue){
        return (celsiusValue * 9/5) + 32;
    }
    console.log(toFahrenheit(39));
    console.log(toFahrenheit(100));
   </script>
</body>
</html>
